spring.application.name=Free_New_Magazine

# Agar tashqi SPRING_DATASOURCE_URL berilsa shuni oladi, bo'lmasa DB_HOST va boshqa parametrlardan yig'adi, ular ham bo'lmasa localhost ga ulanadi
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:postgres}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:Saidakbar123}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Port: Render bergan portni oladi ($PORT yoki $SERVER_PORT), lokalda esa 8090 da ishlaydi
server.port=${PORT:${SERVER_PORT:8090}}

admin.password=${ADMIN_PASSWORD:saidakbar}

# D:/ o'rniga dinamik yo'l: Render/Linux da '/tmp/project-storage', Windows lokalda 'D:/project-storage/'
storage.root=${STORAGE_ROOT:D:/project-storage/}

